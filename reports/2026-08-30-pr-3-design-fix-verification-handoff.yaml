new_findings:
  - id: F-PR3-009
    severity: medium
    status: active
    origin: introduced_by_fix
    locations:
      - doc/Design/detail/IntervalArithmetic.md §13.2
      - doc/Design/detail/IntervalArithmetic.md §15.5
      - doc/Design/detail/IntervalArithmetic.md §18.2
    title: Exact-rational primary oracle lacks finite-overflow expected-result conversion
    problem: >-
      Section 13.2 converts the BCL nearest result to an exact rational before comparing
      it with the exact result. For finite operands whose exact result exceeds binary64
      finite range, the BCL nearest result is Infinity and cannot be converted using the
      finite-binary64 rational path. The previous design explicitly had an overflow
      comparison against maximum finite value; design version 2 dropped it while adding
      overflow fixtures and retaining exact-rational equality as an acceptance gate.
    witness: "double.MaxValue * 2.0 -> nearest +Infinity; Up +Infinity, Down double.MaxValue"
    required_action:
      - Restore an independent exact-oracle finite-overflow conversion branch for all four arithmetic operations.
      - Distinguish finite overflow from exact Infinity caused by Infinity operands/special interval semantics.
      - Ensure overflow fixtures exercise the exact-oracle branch.

