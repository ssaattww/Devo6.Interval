  - id: F-PR3-004
    severity: medium
    source_status: active
    verification_status: partial
    title: IEEE 1788.1 conformance design still has invalid source/adaptation mapping
    remaining_problems:
      - >-
        Section 14.4 says isSingleton is extracted from pinned
        itl/libieeep1788_bool.itl, but the pinned ITF1788 repository contains no
        isSingleton operation at all.
      - >-
        Numeric numsToInterval is required, but the selected
        ieee1788-constructors.itl has only a minimal bare numeric constructor case;
        the pinned libieeep1788_class.itl contains the relevant finite/invalid
        b-numsToInterval corpus and is not listed as an extraction source.
      - >-
        Devo6.Interval defines Empty.Lower/Upper as NaN/NaN while pinned ITF1788 and
        inari define inf(empty)=+Infinity and sup(empty)=-Infinity. The matrix maps
        inf/sup directly to Lower/Upper as required and requires all conformance cases
        to pass without declaring this deviation.
    required_action:
      - Correct the isSingleton provenance by defining repository-owned equivalent cases or another verified source.
      - Correct numeric numsToInterval source selection, e.g. include libieeep1788_class.itl or define an equivalent standards matrix.
      - Resolve Empty inf/sup either by changing pilot endpoint API semantics or declaring an explicit approved standards deviation with a deviation-aware conformance gate.
      - Update the follow-up report/handoff closure claim for F-PR3-004.

  - id: F-PR3-005
    severity: medium
    source_status: active
    verification_status: resolved
    evidence:
