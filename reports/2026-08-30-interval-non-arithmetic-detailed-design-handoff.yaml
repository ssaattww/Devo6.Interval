scope:
  - Define the Phase 4A to Phase 4E implementation roadmap.
  - Design set operations and named interval relations.
  - Design interval overlap classification.
  - Design numeric properties and integer-valued interval functions.
  - Design reciprocal, square, square root, integer power/root, and fused multiply-add.
  - Design exponential, logarithmic, hyperbolic, trigonometric, atan2, and positive-base general power semantics.
  - Define certified endpoint-kernel and MPFR reference requirements.
  - Design a two-component interval-union type and extended division.
  - Design reverse multiplication and cancellative operations.
  - Design decorated intervals and NaI without mixing them into bare Interval.
  - Design exact/outward parsing, formatting, binary interchange, and interval splitting.
  - Define TDD, conformance, cross-architecture, backend-equivalence, and diagnostic-artifact gates.

non_goals:
  - Implement production C# source.
  - Add solution or project files.
  - Add tests, benchmarks, reference adapters, or generated corpora.
  - Add or execute a CI workflow.
  - Implement SIMD or native code.
  - Implement Affine Arithmetic, Taylor Models, root finding, optimization, or a complete solver.
  - Merge PR #3.

