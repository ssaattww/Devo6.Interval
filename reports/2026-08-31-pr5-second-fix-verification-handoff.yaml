findings:
  - id: F-PR5-013
    severity: medium
    origin: introduced_by_fix
    location: tasks/tasks-status.md P4D-000/P4D-001; tasks/phases-status.md Phase 4D preflight
    description: The new +0.0 reducer fixture expects critical/pole decision=none even though 0 is the k=0 member of the Cos 2kπ critical lattice; without a function/lattice selector the field is also undefined.
    impact: A correct reducer may be rejected, or an implementation may omit the exact Cos maximum needed to return +1 when a range contains 2kπ.
    evidence: p4d-reducer-zero fixes inputBits=0x0000000000000000 and critical/pole=none; design section 30.2 defines 2kπ as the Cos upper-extremum lattice.
    required_action: Make the classification function/lattice-specific, for example cosExtremum=maximum and isTanPole=false at k=0, or remove the ambiguous generic decision and add operation-specific exact-zero critical fixtures.
  - id: F-PR5-014
    severity: medium
    origin: introduced_by_fix
    location: reports/2026-08-31-pr5-second-review-followup-handoff.yaml
    description: The file declares schema_version 3 but omits mandatory typed projection sections and the required source_payloads and transport envelope, and retains pending final-head/CI values without a transport reference after those values became known.
    impact: A subsequent chat cannot losslessly reconstruct target identity, evidence, permissions, boundaries, findings, and final CI state; the declared schema is incompatible with the uploaded handoff Skill.
    evidence: The packet uses a shortened custom structure and has no source_payloads or transport; chat-handoff-manager requires every available typed field plus preserved complete core outputs.
    required_action: Regenerate a complete version-3 packet, preserving work-context/implementation/report outputs under source_payloads, using explicit unknown/commit_pending for self-referential values, and externally recording final current HEAD and exact-head CI through transport metadata.

