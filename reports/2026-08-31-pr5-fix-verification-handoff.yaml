findings:
  - id: F-PR5-001
    severity: high
    origin: introduced_by_fix
    location: tasks/phases-status.md §8; tasks/tasks-status.md P4A-000 through P4E-000
    description: Phase 4 preflight exists, but its common smoke rule requires not-yet-implemented first-subphase behavior to exit 0 before the first source Red commit; P4A is circular and P4B contradicts the common gate by requiring a Red smoke.
    impact: Phase 4 can be blocked or TDD/preflight order can be violated.
    evidence: P4A-000 requires Contains smoke pass before dependent P4A-001 Red; P4B-000 asks Square smoke Red while phase common gate requires smoke exit 0.
    required_action: Separate harness/reference readiness in preflight from actual production Red tests; preflight must not require unimplemented subphase behavior to pass.
  - id: F-PR5-007
    severity: medium
    origin: coverage_miss
    location: tasks/tasks-status.md P4E-000/P4E-010
    description: v1 length/offset/endianness are fixed but state-byte numeric mapping and special-state canonical payload/reject-vs-canonicalize rules are not.
    impact: Incompatible encoders/decoders can both satisfy current acceptance.
    evidence: No exact byte-1 state table or per-state payload matrix exists.
    required_action: Require a preflight state-code/payload/decoder-action table and fixed 18-byte fixtures for each state.
  - id: F-PR5-010
    severity: medium
    origin: introduced_by_fix
    location: tasks/tasks-status.md P4B-007/P3-006
    description: Native elementary backend performance gate reuses P3-006 policy whose operation set is Add/Sub/Mul/Div, not the elementary functions supplied by the backend.
    impact: Native endpoint backend performance can be accepted/rejected using unrelated work.
    evidence: P3-006 operation list is Add/Sub/Mul/Div; P4B-007 says use same policy for native backend.
    required_action: Fix an interop-inclusive elementary-function workload for every proposed native production path while reusing only measurement mechanics/threshold concepts.
  - id: F-PR5-011
    severity: medium
    origin: introduced_by_fix
    location: tasks/tasks-status.md P4C-004
    description: Acos domain clipping is stated but the monotonic-decreasing endpoint formula was dropped.
    impact: Task text no longer uniquely rejects increasing-order Acos interval construction.
    evidence: Current P4C-004 has no Acos `[AcosDown(u),AcosUp(l)]` rule; pre-fix task explicitly guarded decreasing order.
    required_action: Restore the explicit decreasing formula and fixed/clipped examples with MPFR expected bits.
  - id: F-PR5-012
    severity: medium
    origin: introduced_by_fix
    location: tasks/tasks-status.md P4E-009/P4E-012; tasks/phases-status.md Phase 4E
    description: Exact persistent text formatting became conditional (`if adopted`), so Phase 4E can complete without exact text interchange.
    impact: A designed Phase 4E output can be omitted and introduced only after the phase/API gate.
    evidence: No preflight condition requires adopting at least one exact round-trip format.
    required_action: Require a formatting decision and at least one exact round-trip format with canonical-bit round-trip fixtures before Phase 4E completion.

