findings:
  - id: F-PR3-010
    severity: high
    status: active
    origin: introduced_by_added_design
    title: IntervalUnion2 strict-gap canonicalization collapses required zero-touch component enclosures
    locations:
      - doc/Design/detail/IntervalArithmetic.md §53.2
      - doc/Design/detail/IntervalArithmetic.md §53.4
      - doc/Design/detail/IntervalArithmetic.md §54
      - doc/Design/detail/IntervalArithmetic.md §55
    witness: >-
      DivideToUnion([1,2], Entire) has mathematical components (-Infinity,0) and
      (0,+Infinity). Their tight closed enclosures meet at signed zero. Current Create2
      merges touching components and returns Entire, losing the two-component result.
    required_action:
      - Decide exact-set versus component-closure-enclosure semantics.
      - If exact-set, represent open endpoints.
      - If component enclosures, permit the zero-touch pair without merging and document the semantics.
      - Add DivideToUnion, ReciprocalToUnion and ReverseMultiply fixtures with Entire denominator/factor.

  - id: F-PR3-011
    severity: high
    status: active
    origin: introduced_by_added_design
    title: Atan2 negative-x branch-cut lower-side contact is not defined and can under-enclose
    locations:
      - doc/Design/detail/IntervalArithmetic.md §50
    witness: >-
      Atan2(y=[-1,0], x=[-2,-1]) contains +pi at y=0 and approaches -pi for y->0-;
      the tight bare hull is [-pi,+pi]. Finite corner values plus a +pi axis candidate do
      not supply the -pi limit.
    required_action:
      - Define a complete negative-x-axis sign matrix.
      - Distinguish lower-side contact, Zero, upper-side contact and crossing.
      - Specify canonical signed-zero handling.
      - Add fixed branch-cut fixtures.

  - id: F-PR3-012
    severity: medium
    status: active
    origin: introduced_by_added_design
    title: General positive-base Pow does not define zero-boundary substitutes for forbidden 0^0 and 0^negative endpoint calls
    locations:
      - doc/Design/detail/IntervalArithmetic.md §51
    witnesses:
      - "Pow([0,0.5],[0,1]) must be [0,1]"
      - "Pow([0,0.5],[-1,0]) must be [1,+Infinity]"
    required_action:
      - Define rectangle-closure candidates for x->0+, y<0, y=0 and x=0,y>0.
      - Do not route undefined point pairs to the scalar kernel.
      - Add zero-boundary fixtures.

  - id: F-PR3-013
    severity: medium
    status: active
    origin: introduced_by_consolidation
    title: DivideToUnion one-sided-zero denominator rules were lost during consolidation
    locations:
      - doc/Design/detail/IntervalArithmetic.md §54
    witness: "DivideToUnion([1,2],[0,1]) has no current branch; expected Count=1 [1,+Infinity]"
    required_action:
      - Restore Y=[0,d] and Y=[c,0] tables for Zero, nonnegative, nonpositive and mixed numerators.
      - Test ConvexHull equality with ordinary division for every one-sided case.

  - id: F-PR3-014
    severity: medium
    status: active
    origin: introduced_by_added_design
    title: Cancellative Empty-total cases return Entire instead of the stated tightest result
    locations:
      - doc/Design/detail/IntervalArithmetic.md §56
    witnesses:
      - "CancelSubtract(Empty, Empty) should be Empty"
      - "CancelSubtract(Empty, bounded) should be Empty"
    required_action:
      - Define the Empty/common/unbounded matrix.
      - Propagate the same semantics to CancelAdd.
      - Record any deliberate divergence from the pinned reference.

  - id: F-PR3-015
    severity: medium
    status: active
    origin: introduced_by_consolidation_and_added_design
    title: IntervalUnion2 and DecoratedInterval value-equality contracts are not represented in the public API
    locations:
      - doc/Design/detail/IntervalArithmetic.md §53.1
      - doc/Design/detail/IntervalArithmetic.md §57.2
      - doc/Design/detail/IntervalArithmetic.md §57.7
    problems:
      - IntervalUnion2 declares IEquatable but omits the typed Equals member.
      - Typed/object Equals, GetHashCode and equality operators are absent.
      - DecoratedInterval text requires reflexive C# equality and Hash but exposes no corresponding members/interfaces.
      - IntervalUnion2 indexer and invalid component access behavior are unspecified.
    required_action:
      - Define complete value-semantics APIs and consistent Hash rules.
      - Keep IEEE semantic equality as a separate named operation.
      - Define indexer/accessor failure behavior.

  - id: F-PR3-016
    severity: medium
    status: active
    origin: introduced_by_added_design
    title: Decoration propagation lacks a cap imposed by the resulting interval state
    locations:
      - doc/Design/detail/IntervalArithmetic.md §57.4
      - doc/Design/detail/IntervalArithmetic.md §57.6
    witness: >-
      Adding two Com point intervals at double.MaxValue yields an unbounded bare enclosure.
      min(input decorations, opDec) can still produce Com, although an unbounded interval
      permits at most Dac.
    required_action:
      - Cap decoration by result state: Empty<=Trv, unbounded<=Dac, bounded<=Com.
      - Centralize NaI/Ill and result canonicalization.
      - Add finite-overflow decoration fixtures.

  - id: F-PR3-017
    severity: low
    status: active
    origin: introduced_by_consolidation
    title: Phase 4A strict-less Empty behavior and BothEmpty inverse were omitted from the sole normative document
    locations:
      - doc/Design/detail/IntervalArithmetic.md §26.6
      - doc/Design/detail/IntervalArithmetic.md §27
    required_action:
      - Restore the strict endpoint-wise less Empty truth table.
      - Add BothEmpty <-> BothEmpty to overlap inverse mapping.
      - Include all 16 inverse fixtures.

