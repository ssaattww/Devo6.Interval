positive_findings:
  - User phase order is coherent and preserved.
  - Multiplication sign-classification table is correct against endpoint extrema and pinned inari.
  - Division positive, negative, zero-only, one-sided-zero and cross-zero tables match intended set semantics and pinned inari.
  - The [-Lower, Upper] representation, Empty, Zero and signed-zero normalization are coherent.
  - AVX-512 four-interval Vector512 packed-rounding concept matches the .NET 10 API surface.
  - Exact rational oracle is appropriately independent from production rounding logic.
  - Reference SHAs for inari and kv are current repository HEADs as of this review.

findings:
  - id: F-PR3-001
    severity: high
    status: active
    origin: introduced_by_change
    locations:
      - doc/Design/detail/IntervalArithmetic.md §8.6
      - doc/Design/detail/IntervalArithmetic.md §8.7
    title: Directed-rounding specification is not implementation-complete
    problem:
      - >-
        Multiplication below abs(product) < 2^-969 names scaling by 2^537 but does
        not define the scaled comparison and residual tie condition that decides
        NextUp/NextDown.
      - >-
        Division says q*y < x / q*y >= x conceptually while relying on exact-product
        decomposition; it omits the required high-product equality plus residual-sign
        tie comparison.
      - >-
        Division lists 2^-969, 2^918, 2^105 and 2^-1074 but omits the large-denominator
        underflow branch returning direction/sign-specific zero or minimum subnormal.
    numerical_witness:
      x: 0.025395755270045856
      y: 9.884361488333468e-07
      q_nearest: 25692.86372217418
      rounded_q_times_y_equals_x: true
      exact_q_times_y_relation_to_x: less
      required_upward_result: 25692.863722174185
      implication: rounded q*y alone cannot decide the upward correction
    reference_conditions:
      multiply_up_scaled: "t < s || (t == s && s2 > 0) -> successor(r)"
      multiply_down_scaled: "t > s || (t == s && s2 < 0) -> predecessor(r)"
      divide_up: "r < x || (r == x && r2 < 0) -> successor(q)"
      divide_down: "r > x || (r == x && r2 > 0) -> predecessor(q)"
      large_denominator_up: "negative quotient -> +0; positive quotient -> +2^-1074"
      large_denominator_down: "negative quotient -> -2^-1074; positive quotient -> +0"
    required_action:
      - Define implementation-complete multiplication and division pseudocode.
      - Define all residual tie conditions.
      - Define small-numerator scaling and large-denominator early returns.
      - Define overflow direction saturation and equality-at-threshold behavior.
      - Ensure every allowed operand pair maps to one unique directed binary64 result.

  - id: F-PR3-002
    severity: medium
    status: active
    origin: introduced_by_change
    locations:
      - doc/Design/detail/IntervalArithmetic.md §4.2
      - doc/Design/detail/IntervalArithmetic.md §15.4
      - doc/Design/detail/IntervalArithmetic.md §15.5
    title: SIMD capability model does not separate x86 FMA from AVX2/SSE2
    problem: >-
      .NET exposes Fma.IsSupported as an independent ISA capability. AVX2 or SSE2
      support alone does not guarantee vector FMA residual instructions.
    required_action:
      - Define AVX-512 packed, AVX2+FMA, AVX2-no-FMA, SSE2-no-FMA, ARM64 and scalar fallback capability rows.
      - For non-FMA x86, choose vectorized error-free product, add/sub-only SIMD with scalar mul/div fallback, or reject the backend after benchmarking.

  - id: F-PR3-003
    severity: low
    status: withdrawn_erratum
    origin: previous_review_error
    title: Previous exact-head CI handoff-state finding is withdrawn
    reason: >-
      A handoff packet cannot know its own future persistence commit SHA. The packet
      correctly marked final publication and CI evidence pending, and the PR completion
      comment recorded final HEAD da6e2ae with zero matching workflow runs and CI未実施.
      No other-SHA run was substituted. Therefore the previous handoff-state complaint
      was over-strong.

  - id: F-PR3-004
    severity: medium
    status: active
    origin: introduced_by_change
    locations:
      - doc/Design/basic/IntervalArithmetic.md §13
      - doc/Design/detail/IntervalArithmetic.md §12
      - doc/Design/detail/IntervalArithmetic.md §14
    title: IEEE 1788.1 conformance-test introduction is missing
    problem: >-
      The accepted basic design explicitly carried IEEE 1788.1 conformance-test
      introduction into detailed design. PR #3 defines exact-rational, differential and
      random tests but does not define a standards conformance corpus/matrix or an
      explicit alternative.
    required_action:
      - Pin a conformance corpus or define an equivalent IEEE 1788.1 matrix.
      - State Phase 1 applicable bare binary64 operations and intentional Phase 4 deferrals.
      - Define API/canonical-zero adaptation and CI/artifact evidence.

  - id: F-PR3-005
    severity: medium
    status: active
    origin: introduced_by_change
    locations:
      - doc/Design/detail/IntervalArithmetic.md §12.4
      - doc/Design/detail/IntervalArithmetic.md §14.2
    title: Reference-oracle responsibility and execution mechanism are not reproducible
    problem:
      - >-
        kv is listed alongside inari for Empty/Entire semantics, but pinned kv ordinary
        division throws domain_error whenever the denominator contains zero; it is not
        compatible with Devo6/inari set-based zero-crossing semantics.
      - >-
        The design does not say how C# tests actually obtain pinned inari/kv results,
        even though mismatch artifacts must contain all backend results.
    required_action:
      - Assign exact-rational oracle as primary mathematical oracle.
      - Assign inari as interval semantic/differential oracle.
      - Restrict kv to directed-rounding primitive/compatible finite endpoint cases.
      - Define a reproducible pinned reference harness or committed golden-corpus generator with toolchain metadata and I/O format.

  - id: F-PR3-006
    severity: medium
    status: active
    origin: introduced_by_change
    locations:
      - doc/Design/detail/IntervalArithmetic.md §4.2
      - doc/Design/detail/IntervalArithmetic.md §13
      - doc/Design/detail/IntervalArithmetic.md §14.2
    title: CI design does not implement the declared x64/ARM64 correctness gate
    problem: >-
      Phase 1 targets x64 and ARM64 and the API-freeze gate requires equal canonical
      results, but the CI section does not require an architecture matrix. Current
      GitHub-hosted Linux ARM64 runners make this directly testable.
    required_action:
      - Require the same deterministic/oracle suite on Linux x64 and Linux ARM64.
      - Preserve per-architecture failure diagnostics.
      - If bit-pattern output is compared across jobs, define a deterministic result artifact/corpus.

  - id: F-PR3-007
    severity: medium
    status: active
    origin: introduced_by_change
    locations:
      - doc/Design/detail/IntervalArithmetic.md §12.2
      - doc/Design/detail/IntervalArithmetic.md §12.3
      - doc/Design/detail/IntervalArithmetic.md §12.5
    title: Deterministic tests omit rounding-algorithm branch boundaries and residual ties
    problem: >-
      Generic subnormal/min-normal/overflow tests do not guarantee coverage of the exact
      thresholds and equality/residual branches introduced by the production algorithm.
      Random testing is unlikely to hit them reliably.
    required_action:
      - Add below/equal/above tests around 2^-969 and 2^918.
      - Cover all sign/direction zero versus minimum-subnormal returns.
      - Cover multiplication scaled <, >, equality+residual branches.
      - Cover division rounded-product equality with positive and negative residual.
      - Cover exact no-correction and positive/negative overflow Up/Down cases.

  - id: F-PR3-008
    severity: low
    status: active
    origin: introduced_by_change
    locations:
      - doc/Design/basic/IntervalArithmetic.md §10.1
      - doc/Design/basic/IntervalArithmetic.md §13
      - doc/Design/detail/IntervalArithmetic.md §3
      - doc/Design/detail/IntervalArithmetic.md §20
    title: Native-backend decision from basic design is no longer traceable
    problem: >-
      The basic design retained managed-only versus native-backend adoption as a
      benchmark-driven future decision. Detailed design correctly excludes native calls
      from Phase 1 but does not explicitly reject or defer the decision in later phases.
    required_action:
      - Explicitly reject native backend for the roadmap, or identify the later benchmark/phase where it may be reconsidered.
      - No native implementation is required for this PR.

