acceptance_model:
  common_source_task_gates:
    - failing test is added first and confirmed to fail for the intended specification
    - Red and Green are kept in small reviewable commits
    - deterministic boundary fixtures cover applicable Empty/signed-zero/Infinity/subnormal/overflow cases
    - exact oracle, MPFR, or pinned reference evidence has no unapproved differences
    - Linux x64 and ARM64 canonical results match
    - multiple production backends, when present, produce bitwise-identical canonical endpoints
    - diagnostic artifacts make the failing case and branch decisions traceable
    - public API baseline is updated when the public surface changes
    - breaking changes are recorded in doc/Design/BreakingChanges.md when required
    - only workflow runs whose head_sha equals the pull request current HEAD can be used as CI evidence
  documentation_exemption:
    tdd_required: false
    reason: Documentation/infra-only tasks do not have production behavior to drive with Red/Green tests.

phase_1_start_order:
  - solution/project/x64+ARM64 CI/diagnostic artifact
  - Interval construction/state/normalization
  - exact-rational oracle and boundary corpus
  - directed add/sub
  - interval add/sub
  - directed mul
  - interval mul
  - directed div
  - interval div
  - Phase 1 conformance harness
  - pinned inari/kv corpus and reference lock
  - sample/API evaluation report

diagnostic_workflow:
  present_at_start: false
  repository_state: .github/workflows contained only .gitkeep
  action_in_this_change: not_added
  reason: >-
    Detailed design section 16.1 explicitly defers workflow creation until the first Phase 1 pull request
    that adds executable project/test targets. Adding an empty workflow in this documentation-only change
    would contradict the current detailed design.
  required_future_task: P1-001
  minimum_future_artifacts:
    - test result
    - stdout
    - stderr
    - diagnostic log
    - runtime/OS/architecture/CPU features
    - reference lock
    - conformance summary
    - canonical result corpus
    - failure case identifier/input sufficient for investigation

